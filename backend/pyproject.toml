[project]
name = "trajecto-backend"
version = "0.1.0"
description = "Trajecto – Railway journey management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.117.1",
    "uvicorn==0.36.0",
    "psycopg2-binary==2.9.10",
    "sqlalchemy",
    "requests==2.32.5",
    "python-dotenv==1.1.1",
    "python-jose[cryptography]",
    "argon2-cffi>=23.1.0,<26",
    "passlib[bcrypt]",
    "PyYAML",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = [
"tests",
]
pythonpath = ["src"]